name: Deploy to GitHub Pages

# Roda na branch padrao (main), liberada pelo environment github-pages.
# Builda o app a partir da branch de feature (publica) e publica no Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build do app (branch de feature)
        run: |
          git clone --depth 1 --branch claude/hyliox-research-cPYZg https://github.com/videon8n/Tudo-que-lembra-.git app
          cd app
          npm install
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
